name: Import game and publish
# How it works: put a public URL of the new index.html on line 1 of
# .github/import-request.txt and its sha256 on line 2, then commit.
# This job downloads it, checks the hash, commits it to main and
# mirrors main to gh-pages, which GitHub Pages serves.
on:
  push:
    branches: [main]
    paths: [".github/import-request.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html from the requested URL and check its hash
        run: |
          URL=$(sed -n 1p .github/import-request.txt)
          SHA=$(sed -n 2p .github/import-request.txt)
          curl -fsSL "$URL" -o /tmp/index.html
          echo "$SHA  /tmp/index.html" | sha256sum -c -
          cp /tmp/index.html index.html
          touch .nojekyll
      - name: Commit to main and publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git diff --cached --quiet || git commit -m "Update game"
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
