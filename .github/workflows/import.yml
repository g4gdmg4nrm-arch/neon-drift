name: Import game and publish
on:
  push:
    branches: [main]
    paths: [".github/import-request.txt"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch index.html from the requested URL and check its hash
        run: |
          URL=$(sed -n 1p .github/import-request.txt)
          SHA=$(sed -n 2p .github/import-request.txt)
          curl -fsSL "$URL" -o /tmp/index.html
          echo "$SHA  /tmp/index.html" | sha256sum -c -
          cp /tmp/index.html index.html
          touch .nojekyll
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git diff --cached --quiet || git commit -m "Update game"
          git push origin HEAD:main
      - name: Enable Pages from main (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages -f "source[branch]=main" -f "source[path]=/" || echo "create failed"
          gh api repos/${{ github.repository }}/pages || true
